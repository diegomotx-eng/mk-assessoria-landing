<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 160">
  <rect width="300" height="160" fill="#ffffff"/>

  <!-- === BUILDINGS === -->
  <!-- Prédio esquerda (grafite, estreito) -->
  <rect x="72" y="28" width="18" height="72" fill="#3a3a3a"/>
  <!-- Prédio esquerda (dourado, largo) -->
  <rect x="92" y="18" width="26" height="82" fill="#b8860b"/>
  <!-- Sombra lateral direita do prédio dourado -->
  <polygon points="118,18 126,26 126,100 118,100" fill="#8a6408"/>

  <!-- Prédio central pequeno (grafite) -->
  <rect x="130" y="38" width="12" height="62" fill="#3a3a3a"/>
  <!-- Sombra lateral -->
  <polygon points="142,38 148,44 148,100 142,100" fill="#555"/>

  <!-- Prédio direita principal (grafite com linhas) -->
  <rect x="152" y="30" width="36" height="70" fill="#3a3a3a"/>
  <!-- Linhas verticais no prédio direito -->
  <line x1="158" y1="30" x2="158" y2="100" stroke="#555" stroke-width="1"/>
  <line x1="164" y1="30" x2="164" y2="100" stroke="#555" stroke-width="1"/>
  <line x1="170" y1="30" x2="170" y2="100" stroke="#555" stroke-width="1"/>
  <line x1="176" y1="30" x2="176" y2="100" stroke="#555" stroke-width="1"/>
  <line x1="182" y1="30" x2="182" y2="100" stroke="#555" stroke-width="1"/>
  <!-- Topo inclinado do prédio direito -->
  <polygon points="152,30 188,30 194,36 188,100 152,100" fill="#3a3a3a"/>
  <line x1="158" y1="30" x2="158" y2="100" stroke="#555" stroke-width="1"/>
  <line x1="165" y1="30" x2="165" y2="100" stroke="#555" stroke-width="1"/>
  <line x1="172" y1="30" x2="172" y2="100" stroke="#555" stroke-width="1"/>
  <line x1="179" y1="30" x2="179" y2="100" stroke="#555" stroke-width="1"/>
  <line x1="186" y1="30" x2="186" y2="100" stroke="#555" stroke-width="1"/>

  <!-- === BASE / TELHADO === -->
  <!-- Linha de base dos prédios (telhado/plataforma) -->
  <polygon points="68,100 130,78 194,100 194,104 68,104" fill="#3a3a3a"/>
  <!-- Dourado no telhado -->
  <polygon points="88,100 130,82 172,100" fill="#b8860b"/>

  <!-- === JANELA CASA (centro) === -->
  <rect x="125" y="88" width="10" height="10" rx="1" fill="#b8860b"/>
  <line x1="130" y1="88" x2="130" y2="98" stroke="#3a3a3a" stroke-width="1"/>
  <line x1="125" y1="93" x2="135" y2="93" stroke="#3a3a3a" stroke-width="1"/>

  <!-- === ARCOS === -->
  <!-- Arco externo (grafite) -->
  <path d="M58,108 Q131,140 202,108" stroke="#3a3a3a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Arco interno (dourado) -->
  <path d="M68,112 Q131,136 192,112" stroke="#b8860b" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- === TEXTO === -->
  <!-- MK -->
  <text x="76" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="900" fill="#3a3a3a" letter-spacing="-1">MK</text>
  <!-- ASSESSORIA -->
  <text x="112" y="152" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#b8860b" letter-spacing="3">ASSESSORIA</text>
</svg>
